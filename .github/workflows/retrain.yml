name: Retrain

on:
  workflow_dispatch:
    inputs:
      dataset_path:
        description: 'Path to updated forecasting dataset'
        default: 'data/processed/forecasting_dataset.parquet'

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Validate dataset
        env:
          PYTHONPATH: src
        run: python src/data/validate.py --dataset ${{ github.event.inputs.dataset_path }}
      - name: Run retraining pipeline
        env:
          PYTHONPATH: src
        run: python scripts/retrain.py --dataset ${{ github.event.inputs.dataset_path }}
      - name: Check Report
        run: cat artifacts/retrain_report.json
