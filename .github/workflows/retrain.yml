name: Retrain

on:
  workflow_dispatch:
    inputs:
      dataset_path:
        description: 'Path to updated forecasting dataset'
        default: 'data/processed/forecasting_dataset.parquet'

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m data.validate --dataset ${{ github.event.inputs.dataset_path }}
      - run: python -m scripts.retrain --dataset ${{ github.event.inputs.dataset_path }}
      - name: Check Report
        run: cat artifacts/retrain_report.json
